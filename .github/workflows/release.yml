name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: RUSTFLAGS="-C target-cpu=x86-64 -C panic=abort" cargo build --release
      - name: Package
        run: |
          mkdir -p dist/voice2text-linux-x86_64
          cp target/release/voice2text dist/voice2text-linux-x86_64/
          cp target/release/v2t-config dist/voice2text-linux-x86_64/
          cp install.sh dist/voice2text-linux-x86_64/
          cp voice2text.service dist/voice2text-linux-x86_64/
          tar czf dist/voice2text-linux-x86_64.tar.gz -C dist voice2text-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/voice2text-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package zip
        run: Compress-Archive -Path target/release/voice2text.exe,target/release/v2t-config.exe -DestinationPath dist/voice2text-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/voice2text-windows-x86_64.zip

  build-macos:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: brew install cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar czf dist/voice2text-macos-${{ matrix.arch }}.tar.gz -C target/${{ matrix.target }}/release voice2text
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/voice2text-macos-${{ matrix.arch }}.tar.gz

  release:
    if: always()
    needs: [build-linux-x86_64, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          ls -lh release-files/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
